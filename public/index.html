<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Orbit - To-Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-grid" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-2" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-3" aria-hidden="true"></div>

    <main class="app-shell">
      <section class="card auth-card" id="authSection">
        <div class="brand-row">
          <span class="brand-pill">PREMIERE TASK FLOW</span>
          <h1>Task Orbit</h1>
          <p class="subhead">Design your day like a production roadmap.</p>
        </div>

        <div class="auth-tabs">
          <button id="showLoginBtn" class="tab-btn active" type="button">Login</button>
          <button id="showRegisterBtn" class="tab-btn" type="button">Register</button>
        </div>

        <form id="loginForm" class="form active">
          <label>
            Email
            <input type="email" id="loginEmail" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" required minlength="6" />
          </label>
          <button type="submit" class="primary-btn">Sign In</button>
        </form>

        <form id="registerForm" class="form">
          <label>
            Username
            <input type="text" id="registerUsername" required minlength="3" />
          </label>
          <label>
            Email
            <input type="email" id="registerEmail" required />
          </label>
          <label>
            Password
            <input type="password" id="registerPassword" required minlength="6" />
          </label>
          <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p id="authMessage" class="message"></p>
      </section>

      <section class="dashboard hidden" id="dashboardSection">
        <header class="card dashboard-header reveal-item">
          <div class="title-stack">
            <span class="brand-pill">YOUR EXECUTION BOARD</span>
            <h2 id="welcomeText">Welcome</h2>
            <p class="subhead">Track momentum, not just checkboxes.</p>
          </div>
          <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
        </header>

        <section class="stats-grid reveal-item">
          <article class="card stat-card">
            <p class="stat-label">Total Tasks</p>
            <h3 id="totalCount">0</h3>
          </article>
          <article class="card stat-card">
            <p class="stat-label">Pending</p>
            <h3 id="pendingCount">0</h3>
          </article>
          <article class="card stat-card">
            <p class="stat-label">Completed</p>
            <h3 id="completedCount">0</h3>
          </article>
          <article class="card stat-card progress-card">
            <p class="stat-label">Completion</p>
            <h3><span id="completionRate">0</span>%</h3>
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </article>
        </section>

        <section class="card panel reveal-item">
          <h3 class="panel-title">Create New Task</h3>
          <form id="addTaskForm" class="task-form">
            <label>
              Task title
              <input type="text" id="taskTitle" required placeholder="e.g. Submit assignment" />
            </label>
            <label>
              Description (optional)
              <textarea id="taskDescription" rows="3" placeholder="Add context, notes, or links"></textarea>
            </label>
            <button type="submit" class="primary-btn">Add Task</button>
          </form>
          <p id="taskMessage" class="message"></p>
        </section>

        <section class="task-columns reveal-item">
          <section class="card panel">
            <div class="panel-head">
              <h3 class="panel-title">Pending</h3>
              <span class="pill-count" id="pendingVisibleCount">0</span>
            </div>
            <div class="task-toolbar">
              <input type="search" id="taskSearch" placeholder="Search tasks..." />
              <div class="filter-group">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="today">Recent</button>
              </div>
            </div>
            <ul id="pendingTasks" class="task-list"></ul>
          </section>
          <section class="card panel">
            <div class="panel-head">
              <h3 class="panel-title">Completed</h3>
              <span class="pill-count" id="completedVisibleCount">0</span>
            </div>
            <ul id="completedTasks" class="task-list"></ul>
          </section>
        </section>
      </section>
    </main>

    <template id="taskItemTemplate">
      <li class="task-item">
        <div class="task-content">
          <h4 class="task-title"></h4>
          <p class="task-desc"></p>
        </div>
        <div class="task-actions">
          <button class="toggle-btn" type="button">Toggle</button>
          <button class="edit-btn" type="button">Edit</button>
          <button class="delete-btn" type="button">Delete</button>
        </div>
      </li>
    </template>

    <dialog id="editTaskDialog" class="edit-dialog">
      <form id="editTaskForm" class="edit-form" method="dialog">
        <h3>Edit Task</h3>
        <label>
          Task title
          <input type="text" id="editTaskTitle" required />
        </label>
        <label>
          Description
          <textarea id="editTaskDescription" rows="4" placeholder="Optional details"></textarea>
        </label>
        <menu class="dialog-actions">
          <button type="button" id="cancelEditBtn" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Changes</button>
        </menu>
      </form>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
